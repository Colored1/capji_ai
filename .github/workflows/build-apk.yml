name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Flet
        run: pip install flet flet-cli
      - name: Build APK
        run: |
          set +o pipefail
          yes | flet build apk --verbose
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: capji-ai-apk
          path: build/apk
